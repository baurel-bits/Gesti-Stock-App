# === APPLICATION ===
spring.application.name=stock-api
spring.profiles.active=postgresql

# === SERVER ===
server.port=8080

# === SPRING DATASOURCE (PostgreSQL - default) ===
spring.config.activate.on-profile=postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/stock_db
spring.datasource.username=stock_user
spring.datasource.password=stock_password
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / HIBERNATE (PostgreSQL) ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# === H2 TEST PROFILE ===
---
spring.config.activate.on-profile=test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
